<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>13enji's Links</title>
    <style>
      :root {
        --bg: #fdfdfd;
        --dot: rgba(17, 17, 17, 0.1);
        --ink: #111111;
        --ink-soft: #6f6f6f;
        --card: #ffffff;
        --card-border: #e7e7e7;
        --card-hover: #f6f6f6;
        --tile: #f1f1f1;
        --accent: #111111;
        --primary-bg: #111111;
        --primary-hover: #000000;
        --on-primary: #ffffff;
        --on-primary-soft: rgba(255, 255, 255, 0.78);
        --on-primary-tile: rgba(255, 255, 255, 0.16);
        --on-accent: #ffffff;
        --shadow: 0 1px 2px rgba(17, 17, 17, 0.04), 0 14px 34px rgba(17, 17, 17, 0.08);
        --shadow-primary: 0 16px 38px rgba(17, 17, 17, 0.3);
        --shadow-avatar: 0 18px 42px rgba(17, 17, 17, 0.2);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0c0c;
          --dot: rgba(255, 255, 255, 0.13);
          --ink: #f5f5f5;
          --ink-soft: #a3a3a3;
          --card: #171717;
          --card-border: #2c2c2c;
          --card-hover: #1f1f1f;
          --tile: #232323;
          --accent: #f5f5f5;
          --primary-bg: #f5f5f5;
          --primary-hover: #ffffff;
          --on-primary: #111111;
          --on-primary-soft: rgba(17, 17, 17, 0.68);
          --on-primary-tile: rgba(17, 17, 17, 0.08);
          --on-accent: #111111;
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 14px 34px rgba(0, 0, 0, 0.35);
          --shadow-primary: 0 16px 38px rgba(0, 0, 0, 0.5);
          --shadow-avatar: 0 18px 42px rgba(0, 0, 0, 0.5);
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background-color: var(--bg);
        background-image: radial-gradient(circle, var(--dot) 5px, transparent 5.6px);
        background-size: 34px 34px;
        color: var(--ink);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }
      .wrap {
        max-width: 460px;
        margin: 0 auto;
        padding: 34px 20px 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      /* Language pill — wide, segmented, black active state */
      .lang-switch {
        width: 100%;
        max-width: 380px;
        display: flex;
        gap: 2px;
        margin-bottom: 46px;
        padding: 6px;
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 999px;
        box-shadow: var(--shadow);
      }
      .lang-btn {
        flex: 1 1 0;
        appearance: none;
        border: 0;
        margin: 0;
        padding: 11px 6px;
        border-radius: 999px;
        background: transparent;
        color: var(--ink-soft);
        font: inherit;
        font-size: 14.5px;
        font-weight: 700;
        line-height: 1.2;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .lang-btn:hover { color: var(--ink); }
      .lang-btn[aria-pressed="true"] {
        background: var(--accent);
        color: var(--on-accent);
      }
      .lang-btn[aria-pressed="true"]:hover { color: var(--on-accent); }
      .lang-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      /* Hero — big round monogram, bold name, script-style tagline */
      .avatar {
        width: 148px;
        height: 148px;
        border-radius: 50%;
        background: var(--ink);
        color: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 54px;
        font-weight: 700;
        letter-spacing: 0.04em;
        font-family: Georgia, "Times New Roman", "Songti SC", serif;
        box-shadow: 0 0 0 7px var(--card), 0 0 0 8px var(--card-border), var(--shadow-avatar);
        user-select: none;
      }
      h1 {
        margin: 26px 0 0;
        font-size: 42px;
        font-weight: 800;
        letter-spacing: -0.01em;
        line-height: 1.15;
        text-align: center;
      }
      .bio {
        margin: 8px 0 0;
        font-family: Georgia, "Times New Roman", "Songti SC", serif;
        font-style: italic;
        font-size: 21px;
        color: var(--ink);
        text-align: center;
      }
      /* Link cards — big chunky buttons, rounded icon tile + chevron */
      .links {
        width: 100%;
        margin-top: 40px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .link-card {
        display: flex;
        align-items: center;
        gap: 18px;
        width: 100%;
        padding: 24px 22px;
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 26px;
        color: var(--ink);
        text-decoration: none;
        box-shadow: var(--shadow);
        transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
      }
      .link-card:hover {
        background: var(--card-hover);
        transform: translateY(-1px);
      }
      .link-card:active { transform: translateY(0); }
      .link-card:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .link-icon {
        flex: 0 0 auto;
        width: 68px;
        height: 68px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--tile);
        color: var(--ink);
      }
      .link-icon svg { width: 32px; height: 32px; display: block; }
      .link-text { flex: 1 1 auto; min-width: 0; text-align: left; }
      .link-title {
        display: block;
        font-size: 21px;
        font-weight: 800;
        line-height: 1.3;
      }
      .link-sub {
        display: block;
        margin-top: 4px;
        font-size: 15px;
        color: var(--ink-soft);
        line-height: 1.45;
      }
      .link-arrow {
        flex: 0 0 auto;
        color: var(--ink-soft);
        font-size: 30px;
        line-height: 1;
      }
      /* Primary card — the shop, solid black (white in dark mode) and dominant */
      .link-card--primary {
        padding: 30px 22px;
        border-radius: 28px;
        background: var(--primary-bg);
        border-color: transparent;
        color: var(--on-primary);
        box-shadow: var(--shadow-primary);
      }
      .link-card--primary:hover { background: var(--primary-hover); }
      .link-card--primary .link-icon {
        width: 76px;
        height: 76px;
        border-radius: 22px;
        background: var(--on-primary-tile);
        color: var(--on-primary);
      }
      .link-card--primary .link-icon svg { width: 36px; height: 36px; }
      .link-card--primary .link-title { font-size: 25px; }
      .link-card--primary .link-sub {
        color: var(--on-primary-soft);
        font-size: 15.5px;
      }
      .link-card--primary .link-arrow { color: var(--on-primary); }
      /* Footer stamp */
      .foot {
        margin-top: 46px;
        padding: 5px 12px 6px;
        border: 1.5px solid var(--ink);
        border-radius: 4px;
        transform: rotate(-2deg);
        font-size: 12px;
        font-weight: 700;
        color: var(--ink);
        letter-spacing: 0.22em;
        text-indent: 0.22em;
      }
      @media (max-width: 360px) {
        .wrap { padding: 26px 14px 40px; }
        .avatar { width: 128px; height: 128px; font-size: 47px; }
        h1 { font-size: 36px; }
        .bio { font-size: 19px; }
        .link-card { padding: 20px 16px; gap: 14px; }
        .link-icon { width: 58px; height: 58px; border-radius: 17px; }
        .link-icon svg { width: 28px; height: 28px; }
        .link-title { font-size: 19px; }
        .link-card--primary { padding: 24px 16px; }
        .link-card--primary .link-icon { width: 64px; height: 64px; border-radius: 19px; }
        .link-card--primary .link-icon svg { width: 31px; height: 31px; }
        .link-card--primary .link-title { font-size: 22px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .link-card { transition: none; }
        .link-card:hover { transform: none; }
        .lang-btn { transition: none; }
      }
    </style>
  </head>
  <body>
    <main class="wrap">

        <button type="button" class="lang-btn" data-lang="zh" aria-pressed="false" aria-label="中文">中文</button>
        <button type="button" class="lang-btn" data-lang="ru" aria-pressed="false" aria-label="Русский">RU</button>
        <button type="button" class="lang-btn" data-lang="es" aria-pressed="false" aria-label="Español">ES</button>

      <div class="avatar" aria-hidden="true">13</div>

          <span class="link-icon" aria-hidden="true">

          </span>

            <span class="link-title">Telegram</span>

        <a class="link-card" href="https://discord.gg/rXf6TWCA" target="_blank" rel="noopener">
          <span class="link-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.32 4.37a19.8 19.8 0 0 0-4.93-1.51 13.8 13.8 0 0 0-.64 1.28 18.3 18.3 0 0 0-5.5 0 12.6 12.6 0 0 0-.64-1.28h-.05A19.7 19.7 0 0 0 3.64 4.37C.53 9.05-.32 13.58.1 18.06a19.9 19.9 0 0 0 6.04 3.03c.49-.66.93-1.37 1.3-2.1a12.9 12.9 0 0 1-2.05-.98c.17-.12.34-.25.5-.38a14.2 14.2 0 0 0 12.22 0c.16.13.33.26.5.38-.65.39-1.34.72-2.05.98.37.73.81 1.44 1.3 2.1a19.8 19.8 0 0 0 6.04-3.03c.5-5.18-.84-9.68-3.58-13.69ZM8.02 15.33c-1.18 0-2.16-1.08-2.16-2.42s.95-2.42 2.16-2.42c1.21 0 2.18 1.1 2.16 2.42 0 1.34-.95 2.42-2.16 2.42Zm7.96 0c-1.18 0-2.15-1.08-2.15-2.42s.95-2.42 2.15-2.42c1.22 0 2.18 1.1 2.16 2.42 0 1.34-.94 2.42-2.16 2.42Z"/></svg>

          <span class="link-text">
            <span class="link-title">Discord</span>

      </nav>

      <p class="foot">13ENJI</p>
    </main>

    <script>
      (function () {
        var I18N = {
          zh: {
            htmlLang: "zh-CN",
            docTitle: "13enji 的链接",
            switchLabel: "切换语言",
            navLabel: "我的链接",
            bio: "我的小店",
            loloTitle: "Lolobuy 注册领券",
            shopSub: "进来逛逛，看看在卖什么",
            loloSub: "用我的邀请链接注册，新人有运费券",
            tgSub: "点开直接联系我",
            discordSub: "我的服务器，进来逛逛"
          },
          en: {
            htmlLang: "en",
            docTitle: "13enji's Links",
            switchLabel: "Switch language",
            navLabel: "My links",
            bio: "My little shop",
            loloTitle: "Lolobuy — sign up & get coupons",
            shopSub: "Come in and see what's for sale",
            loloSub: "Sign up with my invite link — new users get shipping coupons",
            tgSub: "Tap to message me directly",
            discordSub: "My server — come in and have a look"
          },
          ru: {
            htmlLang: "ru",
            docTitle: "Ссылки 13enji",
            switchLabel: "Сменить язык",
            navLabel: "Мои ссылки",
            bio: "Мой магазинчик",
            loloTitle: "Lolobuy — купоны за регистрацию",
            shopSub: "Загляните и посмотрите, что продаётся",
            loloSub: "Регистрируйтесь по моей ссылке — новым пользователям купоны на доставку",
            tgSub: "Нажмите, чтобы написать мне напрямую",
            discordSub: "Мой сервер — заходите посмотреть"
          },
          es: {
            htmlLang: "es",
            docTitle: "Enlaces de 13enji",
            switchLabel: "Cambiar idioma",
            navLabel: "Mis enlaces",
            bio: "Mi tiendita",
            loloTitle: "Lolobuy: cupones al registrarte",
            shopSub: "Entra y mira lo que está en venta",
            loloSub: "Regístrate con mi enlace de invitación: los nuevos usuarios reciben cupones de envío",
            tgSub: "Toca para contactarme directamente",
            discordSub: "Mi servidor: entra y echa un vistazo"
          }
        };

        var switchEl = document.getElementById("langSwitch");
        var navEl = document.getElementById("linksNav");
        var buttons = switchEl.querySelectorAll(".lang-btn");
        var translatable = document.querySelectorAll("[data-i18n]");

        function setLang(lang) {
          var dict = I18N[lang] || I18N.zh;
          document.documentElement.lang = dict.htmlLang;
          document.title = dict.docTitle;
          switchEl.setAttribute("aria-label", dict.switchLabel);
          navEl.setAttribute("aria-label", dict.navLabel);
          for (var i = 0; i < translatable.length; i++) {
            var key = translatable[i].getAttribute("data-i18n");
            if (dict[key]) translatable[i].textContent = dict[key];
          }
          for (var j = 0; j < buttons.length; j++) {
            buttons[j].setAttribute(
              "aria-pressed",
              buttons[j].getAttribute("data-lang") === lang ? "true" : "false"
            );
          }
        }

        switchEl.addEventListener("click", function (event) {
          var btn = event.target.closest(".lang-btn");
          if (btn) setLang(btn.getAttribute("data-lang"));
        });
      })();
    </script>
  </body>
