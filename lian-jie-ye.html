<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>13enji's Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Pirata+One&display=swap" rel="stylesheet" />
    <style>
      :root {
        /* Same visual language as the 13enj! shop: pure black, gothic
           blackletter display type, serif body, square outlined panels. */
        --bg: #000000;
        --ink: #f2f2f2;
        --ink-soft: #9a9a9a;
        --panel: #0d0d0d;
        --panel-hi: #1c1c1c;
        --panel-hover: #161616;
        --line: #3a3a3a;
        --line-soft: #262626;
        --btn-top: #3d3d3d;
        --btn-bottom: #141414;
        --font-display: "Pirata One", "EB Garamond", Georgia, serif;
        --font-serif: "EB Garamond", "Songti SC", "STSong", "SimSun", Georgia, serif;
        --font-caps: "Cinzel", "EB Garamond", "Songti SC", Georgia, serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-serif);
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }
      .wrap {
        max-width: 460px;
        margin: 0 auto;
        padding: 34px 20px 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      /* Language switch — the shop's square segmented bar:
         thin outline, serif caps, raised gradient on the active cell */
      .lang-switch {
        width: 100%;
        max-width: 380px;
        display: flex;
        margin-bottom: 48px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 3px;
        overflow: hidden;
      }
      .lang-btn {
        flex: 1 1 0;
        appearance: none;
        border: 0;
        border-right: 1px solid var(--line-soft);
        margin: 0;
        padding: 11px 4px;
        background: transparent;
        color: var(--ink-soft);
        font-family: var(--font-caps);
        font-size: 13.5px;
        font-weight: 600;
        letter-spacing: 0.14em;
        line-height: 1.2;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .lang-btn:last-child { border-right: 0; }
      .lang-btn:hover { color: var(--ink); }
      .lang-btn[aria-pressed="true"] {
        background: linear-gradient(180deg, var(--btn-top), var(--btn-bottom));
        color: var(--ink);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
      }
      .lang-btn[aria-pressed="true"]:hover { color: var(--ink); }
      .lang-btn:focus-visible {
        outline: 1px solid var(--ink);
        outline-offset: -3px;
      }
      /* Hero — blackletter monogram in a thin double-ruled ring,
         blackletter name, letterspaced serif tagline */
      .avatar {
        width: 148px;
        height: 148px;
        border-radius: 50%;
        background: #050505;
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-size: 62px;
        line-height: 1;
        padding-top: 8px;
        border: 1px solid var(--line);
        box-shadow: 0 0 0 5px var(--bg), 0 0 0 6px var(--line-soft);
        user-select: none;
      }
      h1 {
        margin: 30px 0 0;
        font-family: var(--font-display);
        font-weight: 400;
        font-size: 64px;
        line-height: 1.05;
        text-align: center;
      }
      .bio {
        margin: 12px 0 0;
        font-family: var(--font-caps);
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        text-transform: uppercase;
        color: var(--ink-soft);
        text-align: center;
      }
      /* Link cards — the shop's flat square panels:
         thin rule border, serif caps title, quiet serif sub */
      .links {
        width: 100%;
        margin-top: 44px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .link-card {
        display: flex;
        align-items: center;
        gap: 18px;
        width: 100%;
        padding: 22px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 3px;
        color: var(--ink);
        text-decoration: none;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      .link-card:hover {
        background: var(--panel-hover);
        border-color: #4d4d4d;
      }
      .link-card:focus-visible {
        outline: 1px solid var(--ink);
        outline-offset: 3px;
      }
      .link-icon {
        flex: 0 0 auto;
        width: 58px;
        height: 58px;
        border: 1px solid var(--line-soft);
        border-radius: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--panel-hi);
        color: var(--ink);
      }
      .link-icon svg { width: 27px; height: 27px; display: block; }
      .link-text { flex: 1 1 auto; min-width: 0; text-align: left; }
      .link-title {
        display: block;
        font-family: var(--font-caps);
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.16em;
        line-height: 1.35;
      }
      .link-sub {
        display: block;
        margin-top: 5px;
        font-size: 16.5px;
        color: var(--ink-soft);
        line-height: 1.45;
      }
      .link-arrow {
        flex: 0 0 auto;
        color: var(--ink-soft);
        font-family: var(--font-serif);
        font-size: 26px;
        line-height: 1;
      }
      /* Primary card — the shop itself, set apart the way the shop sets
         its panels apart: diagonal hatch, blackletter name, brighter rule */
      .link-card--primary {
        padding: 28px 22px;
        border-color: #4d4d4d;
        background-color: var(--panel-hi);
        background-image: repeating-linear-gradient(
          -45deg,
          rgba(255, 255, 255, 0.035) 0,
          rgba(255, 255, 255, 0.035) 1px,
          transparent 1px,
          transparent 7px
        );
      }
      .link-card--primary:hover {
        background-color: #222222;
        border-color: #666666;
      }
      .link-card--primary .link-icon {
        width: 66px;
        height: 66px;
        background: #050505;
        border-color: var(--line);
        color: var(--ink);
      }
      .link-card--primary .link-icon svg { width: 31px; height: 31px; }
      .link-card--primary .link-title {
        font-family: var(--font-display);
        font-weight: 400;
        font-size: 34px;
        letter-spacing: 0.02em;
        line-height: 1.1;
      }
      .link-card--primary .link-sub {
        color: #b5b5b5;
        font-size: 17px;
      }
      .link-card--primary .link-arrow { color: var(--ink); }
      /* Footer mark — quiet letterspaced caps between two rules */
      .foot {
        margin-top: 48px;
        padding-top: 16px;
        border-top: 1px solid var(--line-soft);
        font-family: var(--font-caps);
        font-size: 11px;
        font-weight: 500;
        color: var(--ink-soft);
        letter-spacing: 0.4em;
        text-indent: 0.4em;
        text-align: center;
      }
      @media (max-width: 360px) {
        .wrap { padding: 26px 14px 40px; }
        .avatar { width: 128px; height: 128px; font-size: 54px; }
        h1 { font-size: 54px; }
        .bio { font-size: 12.5px; }
        .lang-btn { font-size: 12.5px; letter-spacing: 0.08em; }
        .link-card { padding: 18px 16px; gap: 14px; }
        .link-icon { width: 50px; height: 50px; }
        .link-icon svg { width: 24px; height: 24px; }
        .link-title { font-size: 15.5px; }
        .link-card--primary { padding: 22px 16px; }
        .link-card--primary .link-icon { width: 56px; height: 56px; }
        .link-card--primary .link-icon svg { width: 27px; height: 27px; }
        .link-card--primary .link-title { font-size: 29px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .link-card { transition: none; }
        .lang-btn { transition: none; }
      }
    </style>
  </head>
  <body>

    <script>
      (function () {
        var I18N = {
          zh: {
            htmlLang: "zh-CN",
            docTitle: "13enji 的链接",
            switchLabel: "切换语言",
            navLabel: "我的链接",
            bio: "我的小店",
            loloTitle: "Lolobuy 注册领券",
            shopSub: "进来逛逛，看看在卖什么",
            loloSub: "用我的邀请链接注册，新人有运费券",
            tgSub: "点开直接联系我",
            discordSub: "我的服务器，进来逛逛"
          },
          en: {
            htmlLang: "en",
            docTitle: "13enji's Links",
            switchLabel: "Switch language",
            navLabel: "My links",
            bio: "My little shop",
            loloTitle: "Lolobuy — sign up & get coupons",
            shopSub: "Come in and see what's for sale",
            loloSub: "Sign up with my invite link — new users get shipping coupons",
            tgSub: "Tap to message me directly",
            discordSub: "My server — come in and have a look"
          },
          ru: {
            htmlLang: "ru",
            docTitle: "Ссылки 13enji",
            switchLabel: "Сменить язык",
            navLabel: "Мои ссылки",
            bio: "Мой магазинчик",
            loloTitle: "Lolobuy — купоны за регистрацию",
            shopSub: "Загляните и посмотрите, что продаётся",
            loloSub: "Регистрируйтесь по моей ссылке — новым пользователям купоны на доставку",
            tgSub: "Нажмите, чтобы написать мне напрямую",
            discordSub: "Мой сервер — заходите посмотреть"
          },
          es: {
            htmlLang: "es",
            docTitle: "Enlaces de 13enji",
            switchLabel: "Cambiar idioma",
            navLabel: "Mis enlaces",
            bio: "Mi tiendita",
            loloTitle: "Lolobuy: cupones al registrarte",
            shopSub: "Entra y mira lo que está en venta",
            loloSub: "Regístrate con mi enlace de invitación: los nuevos usuarios reciben cupones de envío",
            tgSub: "Toca para contactarme directamente",
            discordSub: "Mi servidor: entra y echa un vistazo"
          }
        };

        var switchEl = document.getElementById("langSwitch");
        var navEl = document.getElementById("linksNav");
        var buttons = switchEl.querySelectorAll(".lang-btn");
        var translatable = document.querySelectorAll("[data-i18n]");

        function setLang(lang) {
          var dict = I18N[lang] || I18N.zh;
          document.documentElement.lang = dict.htmlLang;
          document.title = dict.docTitle;
          switchEl.setAttribute("aria-label", dict.switchLabel);
          navEl.setAttribute("aria-label", dict.navLabel);
          for (var i = 0; i < translatable.length; i++) {
            var key = translatable[i].getAttribute("data-i18n");
            if (dict[key]) translatable[i].textContent = dict[key];
          }
          for (var j = 0; j < buttons.length; j++) {
            buttons[j].setAttribute(
              "aria-pressed",
              buttons[j].getAttribute("data-lang") === lang ? "true" : "false"
            );
          }
        }

        switchEl.addEventListener("click", function (event) {
          var btn = event.target.closest(".lang-btn");
          if (btn) setLang(btn.getAttribute("data-lang"));
        });
      })();
    </script>
